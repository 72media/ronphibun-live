name: Camera snapshot to R2

on:
  schedule:
    - cron: '*/5 * * * *'    # ทุก 5 นาที (GitHub อาจเลื่อนได้ไม่กี่นาทีตอนคิวแน่น)
  workflow_dispatch:          # กดรันเองจากหน้า Actions เพื่อทดสอบ

# ถ้ารอบเก่าค้าง แล้วรอบใหม่เริ่ม ให้ยกเลิกรอบเก่าทิ้ง จะได้ไม่ค้างต่อกัน
concurrency:
  group: snapshot
  cancel-in-progress: true

env:
  TZ: Asia/Bangkok                       # ชั่วโมงของภาพรายชั่วโมงเป็นเวลาไทย
  R2_BUCKET: vigi-weather
  R2_ENDPOINT: https://cde9b0cbd85e60217ce645180785a992.r2.cloudflarestorage.com
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  snap:
    runs-on: ubuntu-24.04      # ล็อกเวอร์ชัน ไม่ใช้ latest เพราะกำลังย้ายไป Ubuntu 26
    timeout-minutes: 8
    steps:
      # ติดตั้ง ffmpeg: ลองติดตั้งตรงๆ ก่อน (ไม่ update, ไม่ลงแพ็กเกจเสริม เร็วสุด)
      # ถ้าพลาด ค่อย update แล้วลองใหม่ รวมสูงสุด 3 ครั้ง และเช็กว่า ffmpeg รันได้จริง
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          ok() { ffmpeg -version >/dev/null 2>&1; }
          ok && { echo "มี ffmpeg ที่ใช้งานได้แล้ว"; exit 0; }
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o DPkg::Lock::Timeout=30"
          for i in 1 2 3; do
            echo "ติดตั้งครั้งที่ $i"
            if [ "$i" -gt 1 ]; then timeout 80 $APT update -qq || true; fi
            timeout 100 $APT install -y -qq --no-install-recommends ffmpeg || true
            ok && { echo "ติดตั้งสำเร็จ"; exit 0; }
            sleep 3
          done
          echo "ติดตั้ง ffmpeg ไม่สำเร็จ"; exit 1

      - name: Grab frame from VIGI C340 (RTSP)
        timeout-minutes: 1
        env:
          VIGI_USER: ${{ secrets.VIGI_USER }}
          VIGI_PASS: ${{ secrets.VIGI_PASS }}
          CAM_HOST: ${{ secrets.CAM_HOST }}   # เช่น mycam.ddns.net:3380
        run: |
          # -timeout 15000000 = ถ้ากล้องไม่ตอบเกิน 15 วินาที ให้เลิก (กันค้าง)
          timeout -k 5 45 ffmpeg -y -loglevel error -rtsp_transport tcp -timeout 15000000 \
            -i "rtsp://${VIGI_USER}:${VIGI_PASS}@${CAM_HOST}/stream1" \
            -frames:v 1 -q:v 3 snap.jpg

      - name: Upload to Cloudflare R2 (latest + hourly)
        timeout-minutes: 1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        run: |
          set -euo pipefail
          AWS="aws --endpoint-url $R2_ENDPOINT --cli-connect-timeout 15 --cli-read-timeout 30"

          # 1) ภาพล่าสุด (อัปทับทุกรอบ)
          $AWS s3 cp snap.jpg "s3://$R2_BUCKET/market-latest.jpg" \
            --content-type image/jpeg --cache-control "max-age=60"

          # 2) ภาพประจำชั่วโมง: hourly/00.jpg ... hourly/23.jpg (24 ไฟล์ เขียนทับของเมื่อวาน)
          #    ถ่ายเก็บครั้งแรกของแต่ละชั่วโมงเท่านั้น รอบที่เหลือของชั่วโมงเดียวกันข้าม
          SLOT=$(date +%H)
          NOW_H=$(date +%F-%H)
          LM=$($AWS s3api head-object --bucket "$R2_BUCKET" --key "hourly/${SLOT}_t.jpg" \
                 --query LastModified --output text 2>/dev/null || true)
          LM_H=""
          if [ -n "$LM" ] && [ "$LM" != "None" ]; then LM_H=$(date -d "$LM" +%F-%H 2>/dev/null || true); fi

          if [ "$LM_H" = "$NOW_H" ]; then
            echo "ชั่วโมง $SLOT มีภาพแล้ว ข้าม"
          else
            echo "เก็บภาพประจำชั่วโมง $SLOT"
            ffmpeg -y -loglevel error -i snap.jpg -vf scale=480:-2 -q:v 5 thumb.jpg
            # อัปภาพเต็มก่อน แล้วค่อยอัปภาพย่อ (หน้าเว็บใช้ภาพย่อเป็นตัวบอกว่ามีภาพแล้ว)
            $AWS s3 cp snap.jpg "s3://$R2_BUCKET/hourly/${SLOT}.jpg" \
              --content-type image/jpeg --cache-control "public, max-age=300"
            $AWS s3 cp thumb.jpg "s3://$R2_BUCKET/hourly/${SLOT}_t.jpg" \
              --content-type image/jpeg --cache-control "public, max-age=300"
          fi
